    <script>
      (function() {
        try {
          var originalFetch = typeof window !== 'undefined' ? window.fetch : null;
          if (originalFetch) {
            var currentFetch = originalFetch;
            try {
              Object.defineProperty(window, 'fetch', {
                get: function() {
                  return currentFetch;
                },
                set: function(fn) {
                  currentFetch = fn;
                },
                configurable: true,
                enumerable: true
              });
            } catch (e1) {
              if (typeof Window !== 'undefined' && Window.prototype) {
                try {
                  Object.defineProperty(Window.prototype, 'fetch', {
                    get: function() {
                      return currentFetch;
                    },
                    set: function(fn) {
                      currentFetch = fn;
                    },
                    configurable: true,
                    enumerable: true
                  });
                } catch (e2) {}
              }
            }
          }
          window.addEventListener('error', function(e) {
            if (e && e.message && e.message.indexOf('Cannot set property fetch') !== -1) {
              e.preventDefault && e.preventDefault();
              e.stopImmediatePropagation && e.stopImmediatePropagation();
              return true;
            }
          }, true);
        } catch (err) {}
      })();
    </script>
